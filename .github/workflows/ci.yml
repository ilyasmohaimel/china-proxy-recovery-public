name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: ShellCheck
        run: |
          shellcheck -S warning \
            oci-emergency-ip/oci-emergency-ip \
            scripts/backup-deployment \
            scripts/proxyctl \
            monitoring/probes/lib.sh \
            monitoring/probes/probe-adguard \
            monitoring/probes/probe-all \
            monitoring/probes/probe-backup \
            monitoring/probes/probe-hysteria2 \
            monitoring/probes/probe-oci-dry-run \
            monitoring/probes/probe-oci-status \
            monitoring/probes/probe-reality \
            monitoring/probes/probe-server \
            monitoring/probes/probe-xhttp

      - name: Python syntax check
        run: |
          python -m py_compile monitoring/probes/*.py monitoring/crowdsec-ntfy/*.py
          python -m compileall -q monitoring/probes monitoring/crowdsec-ntfy

      - name: JSON validation
        run: |
          shopt -s nullglob

          for f in configs/xray/*.example; do
            echo "checking $f"
            python -m json.tool "$f" >/dev/null
          done

          for f in monitoring/probes/*.json; do
            echo "checking $f"
            python -m json.tool "$f" >/dev/null
          done

      - name: YAML validation
        run: |
          pip install -q pyyaml
          python -c "import yaml, pathlib, sys; [yaml.safe_load(p.read_text()) for p in pathlib.Path('.').rglob('*.yaml') if p.is_file()]; [yaml.safe_load(p.read_text()) for p in pathlib.Path('.').rglob('*.yml') if p.is_file()]"
          python -c "import yaml, pathlib; [yaml.safe_load(p.read_text()) for p in pathlib.Path('configs').rglob('*.yaml*')]"
          echo "YAML parse OK"

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
